<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام مناوبات المستشفى</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14233a;--mu:#586a86;--pr:#093365;--pr2:#e3eaf5;--ac:#d4b532;--bd:#d2dbe9;--rd:#b42318;--rd2:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1522;--card:#121f33;--tx:#e6edf7;--mu:#9fb1cc;--pr:#3f78c4;--pr2:#1a2d4a;--ac:#d4b532;--bd:#2a3f5f;--rd:#ff8a7e;--rd2:#3b1f1d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1522;--card:#121f33;--tx:#e6edf7;--mu:#9fb1cc;--pr:#3f78c4;--pr2:#1a2d4a;--ac:#d4b532;--bd:#2a3f5f;--rd:#ff8a7e;--rd2:#3b1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#093365;color:#fff;border-bottom:3px solid #d4b532}
header b{font:700 21px/1.3 Cairo,"IBM Plex Sans Arabic",Tahoma,sans-serif;display:block}.ht{display:flex;flex-direction:column;margin-inline-start:8px}.ht small{opacity:.8;font-size:12px}.hc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hc label{font-size:12px;display:flex;gap:6px;align-items:center}#lgi{display:block;height:100%}.sp{flex:1}
header select{border:0;border-radius:8px;padding:5px 8px}
nav{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd)}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font:700 18px/1.4 Cairo,"IBM Plex Sans Arabic",Tahoma,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:28px;color:var(--pr);line-height:1.2}.kpi span{color:var(--mu)}
.ov{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--bd);padding:6px 9px;text-align:right;vertical-align:top}
th{background:var(--pr2)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}
.btn.g{background:var(--pr2);color:var(--pr)}.btn.r{background:var(--rd2);color:var(--rd)}.btn.s{padding:3px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row label{color:var(--mu);font-size:13px}
.chip{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:20px;padding:0 9px;margin:2px;font-size:13px}
.bad{background:var(--rd2)}.sh{display:block;color:var(--rd);font-size:12px}
.dy{white-space:nowrap;font-weight:600}
.bar{height:8px;background:var(--pr2);border-radius:4px;margin-top:3px}.bar i{display:block;height:100%;background:var(--pr);border-radius:4px}
.mu{color:var(--mu)}.err{color:var(--rd);min-height:22px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(580px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fl{display:grid;gap:8px}.fl label{display:grid;gap:2px;font-size:13px;color:var(--mu)}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;color:var(--tx);font-size:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:9}
.po{display:none}
.lg{height:var(--lh,64px);display:flex;align-items:center;cursor:pointer}.lg img{height:100%;width:auto;max-width:240px;object-fit:contain;display:block}
nav .btn:not(.g){box-shadow:inset 0 -3px 0 var(--ac)}.kpi{border-top:3px solid var(--ac)}
@media print{header,nav,.np,dialog,#toast{display:none!important}.po{display:block}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<header><label class="lg" title="تغيير الشعار (مدير النظام)"><span id="lgi"></span><input type="file" id="lgf" accept="image/*" hidden></label><div class="ht"><b>نظام مناوبات المستشفى</b><small>إدارة الأقسام والموظفين والمناوبات</small></div><span class="sp"></span><div class="hc"><label id="lgs" class="np">حجم الشعار <input type="range" id="lgr" min="36" max="120" value="64"></label><select id="role" aria-label="الدور"></select><select id="ref" aria-label="الحساب"></select></div></header>
<nav id="nav" class="np"></nav>
<main id="main"></main>
<dialog id="dlg"><h2 id="dt"></h2><div id="db"></div><div class="err" id="er"></div><div class="row"><button class="btn" id="ok">حفظ</button><button class="btn g" id="cx">إلغاء</button></div></dialog>
<div id="toast"></div>
<script>
const D=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const hrs=p=>{let d=mins(p.end)-mins(p.start);if(d<=0)d+=1440;return d/60};
const isN=p=>{const s=mins(p.start);return s>=1200||s<360};
const key=(d,y,m)=>d.id+'|'+y+'-'+m;
const PER={8:[['الفترة الصباحية','08:00','16:00',2]],16:[['الفترة الصباحية','08:00','16:00',2],['الفترة المسائية','16:00','00:00',2]],24:[['الفترة الصباحية','08:00','16:00',2],['الفترة المسائية','16:00','00:00',2],['الفترة الليلية','00:00','08:00',1]]};
const mkP=t=>PER[t].map(([name,start,end,need])=>({name,start,end,need}));
const TYPES=['متغير','صباحي','مسائي','ليلي'];
function seed(){
 const S={depts:[],emps:[],sched:{},set:{maxH:200,minH:120,maxWeek:5},role:{t:'admin',r:''}};
 const add=(name,type,names,title)=>{const d={id:uid(),name,type,periods:mkP(type)};S.depts.push(d);names.forEach((n,i)=>S.emps.push({id:uid(),name:n,num:String(1000+S.emps.length+1),title,dept:d.id,type:'متغير',off:[],active:true}))};
 add('الطوارئ',24,['أحمد الشهري','سارة القحطاني','خالد العتيبي','نورة الدوسري','فهد الغامدي','ريم الزهراني','ماجد الحربي','هند المطيري'],'ممرض/ة');
 add('المختبر',16,['عمر السبيعي','لمى الشمري','بدر العنزي','منى اليامي'],'فني مختبر');
 add('الصيدلية',8,['يوسف القرني','دانة البقمي','سلطان الرشيد'],'صيدلي/ة');
 return S;
}
let S=(()=>{try{const v=localStorage.getItem('hms1');if(v)return JSON.parse(v)}catch(e){}return seed()})();
const now0=new Date();
let V={tab:'dash',d:'',y:now0.getFullYear(),m:now0.getMonth(),e:''},tmp=[];
const save=()=>{try{localStorage.setItem('hms1',JSON.stringify(S))}catch(e){}};
const nm=id=>S.emps.find(e=>e.id==id)?.name||'—';
const dn=id=>S.depts.find(d=>d.id==id)?.name||'—';
const toast=t=>{const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)};
function vd(){const r=S.role;if(r.t=='admin')return S.depts;if(r.t=='head')return S.depts.filter(d=>d.id==r.r);const e=S.emps.find(x=>x.id==r.r);return S.depts.filter(d=>e&&d.id==e.dept)}
function modal(title,html,fn){$('#dt').textContent=title;$('#db').innerHTML=html;$('#er').textContent='';$('#ok').onclick=()=>{if(fn()!==false){$('#dlg').close();render()}};$('#cx').onclick=()=>$('#dlg').close();$('#dlg').showModal()}
const fail=t=>{$('#er').textContent=t;return false};

/* ---------- الجدولة التلقائية ---------- */
function gen(d,y,m){
 const emps=S.emps.filter(e=>e.dept==d.id&&e.active),n=new Date(y,m+1,0).getDate(),out={};
 const tot={},nt={},per={},wk={},hr={},last={};
 emps.forEach(e=>{tot[e.id]=0;nt[e.id]=0;hr[e.id]=0;wk[e.id]=0;per[e.id]=d.periods.map(()=>0)});
 for(let day=1;day<=n;day++){
  const dow=new Date(y,m,day).getDay();
  if(dow===0)emps.forEach(e=>wk[e.id]=0);
  const used=new Set();out[day]={};
  d.periods.forEach((p,i)=>{
   const h=hrs(p),night=isN(p);
   const c=emps.filter(e=>!used.has(e.id)&&!e.off.includes(dow)&&wk[e.id]<S.set.maxWeek&&hr[e.id]+h<=S.set.maxH&&!(last[e.id]&&last[e.id].n&&!night&&last[e.id].d==day-1)&&!(e.type=='صباحي'&&mins(p.start)>=960)&&!(e.type=='ليلي'&&!night));
   c.sort((a,b)=>(night?nt[a.id]-nt[b.id]:0)||per[a.id][i]-per[b.id][i]||tot[a.id]-tot[b.id]||((day+emps.indexOf(a))%emps.length-(day+emps.indexOf(b))%emps.length));
   const pick=c.slice(0,p.need);
   pick.forEach(e=>{used.add(e.id);tot[e.id]++;wk[e.id]++;hr[e.id]+=h;per[e.id][i]++;if(night)nt[e.id]++;last[e.id]={d:day,n:night}});
   out[day][i]=pick.map(e=>e.id);
  });
 }
 return out;
}

/* ---------- لوحة التحكم ---------- */
function dash(){
 const ds=vd(),es=S.emps.filter(e=>ds.some(d=>d.id==e.dept)),now=new Date(),mn=now.getHours()*60+now.getMinutes();
 const cur=[],up=[],sh=[];
 ds.forEach(d=>{
  const get=(dt,j)=>{const s=S.sched[key(d,dt.getFullYear(),dt.getMonth())];return(s&&s[dt.getDate()]&&s[dt.getDate()][j])||[]};
  const yd=new Date(+now-864e5),tm=new Date(+now+864e5);
  d.periods.forEach((p,j)=>{
   const s=mins(p.start),e=mins(p.end),cross=e<=s;
   if(cross?mn>=s:(mn>=s&&mn<e))get(now,j).forEach(id=>cur.push([id,d.name,p]));
   if(cross&&e>0&&mn<e)get(yd,j).forEach(id=>cur.push([id,d.name,p]));
   if(s>mn)get(now,j).forEach(id=>up.push([id,d.name,p,'اليوم']));
   get(tm,j).forEach(id=>up.push([id,d.name,p,'غداً']));
  });
  const sc=S.sched[key(d,now.getFullYear(),now.getMonth())];
  if(!sc)sh.push([d.name,'لم يُنشأ جدول هذا الشهر']);
  else{let c=0;Object.values(sc).forEach(day=>d.periods.forEach((p,j)=>{c+=Math.max(0,p.need-((day[j]||[]).length))}));if(c)sh.push([d.name,'ينقص '+c+' موظف في المناوبات'])}
 });
 const mx=Math.max(1,...ds.map(d=>S.emps.filter(e=>e.dept==d.id).length));
 const li=(a)=>a.length?a.slice(0,8).map(([id,d,p,w])=>`<div>${esc(nm(id))} <span class="mu">– ${esc(d)}، ${esc(p.name)} ${p.start}–${p.end}${w?' ('+w+')':''}</span></div>`).join(''):'<span class="mu">لا يوجد</span>';
 return `<div class="grid"><div class="kpi"><b>${ds.length}</b><span>إجمالي الأقسام</span></div><div class="kpi"><b>${es.length}</b><span>إجمالي الموظفين (${es.filter(e=>e.active).length} فعّال)</span></div><div class="kpi"><b>${ds.reduce((a,d)=>a+d.periods.length,0)}</b><span>المناوبات اليومية</span></div><div class="kpi"><b>${cur.length}</b><span>في المناوبة الآن</span></div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
 <div class="card"><h2>الموظفون في كل قسم</h2>${ds.map(d=>{const c=S.emps.filter(e=>e.dept==d.id).length;return`<div style="margin-bottom:8px">${esc(d.name)} <span class="mu">(${c} – ${d.type} ساعة)</span><div class="bar"><i style="width:${c/mx*100}%"></i></div></div>`}).join('')}</div>
 <div class="card"><h2>الموجودون الآن في المناوبة</h2>${li(cur)}</div>
 <div class="card"><h2>المناوبات القادمة</h2>${li(up)}</div>
 <div class="card"><h2>أقسام لديها نقص</h2>${sh.length?sh.map(x=>`<div><b>${esc(x[0])}</b> <span class="mu">– ${x[1]}</span></div>`).join(''):'<span class="mu">لا يوجد نقص</span>'}</div></div>`;
}

/* ---------- الأقسام ---------- */
function depts(){
 return `<div class="card"><div class="row"><h2 style="margin:0">أقسام المستشفى</h2><span class="sp"></span><button class="btn" onclick="editDept()">+ إضافة قسم</button></div><div class="ov"><table><tr><th>القسم</th><th>طبيعة العمل</th><th>الموظفون</th><th>فترات الدوام</th><th></th></tr>${S.depts.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.type} ساعة</td><td>${S.emps.filter(e=>e.dept==d.id).length}</td><td>${d.periods.map(p=>`<span class="chip">${esc(p.name)} ${p.start}–${p.end} (${p.need})</span>`).join('')}</td><td><button class="btn g s" onclick="editDept('${d.id}')">تعديل</button> <button class="btn r s" onclick="delDept('${d.id}')">حذف</button></td></tr>`).join('')}</table></div></div>`;
}
function pRows(){$('#pl').innerHTML=tmp.map((p,i)=>`<div class="row"><input value="${esc(p.name)}" oninput="tmp[${i}].name=this.value" style="width:130px" aria-label="اسم الفترة"><input type="time" value="${p.start}" onchange="tmp[${i}].start=this.value"><input type="time" value="${p.end}" onchange="tmp[${i}].end=this.value"><input type="number" min="1" value="${p.need}" onchange="tmp[${i}].need=+this.value" style="width:60px" title="عدد الموظفين المطلوب"><button class="btn r s" onclick="tmp.splice(${i},1);pRows()">✕</button></div>`).join('')}
function editDept(id){
 const d=S.depts.find(x=>x.id==id)||{name:'',type:24,periods:mkP(24)};tmp=JSON.parse(JSON.stringify(d.periods));
 modal(id?'تعديل القسم':'قسم جديد',`<div class="fl"><label>اسم القسم<input id="dn" value="${esc(d.name)}"></label><label>طبيعة العمل<select id="dty" onchange="tmp=mkP(this.value);pRows()">${[8,16,24].map(t=>`<option value="${t}" ${d.type==t?'selected':''}>${t} ساعة</option>`).join('')}</select></label><div class="mu">فترات الدوام: الاسم، البداية، النهاية، عدد الموظفين المطلوب</div><div id="pl"></div><button class="btn g s" style="justify-self:start" onclick="tmp.push({name:'فترة جديدة',start:'08:00',end:'16:00',need:1});pRows()">+ إضافة فترة</button></div>`,()=>{
  const name=$('#dn').value.trim();if(!name)return fail('اكتب اسم القسم');if(!tmp.length)return fail('أضف فترة دوام واحدة على الأقل');
  if(tmp.some(p=>!p.start||!p.end||!(p.need>0)))return fail('أكمل أوقات الفترات وعدد الموظفين');
  const o=S.depts.find(x=>x.id==id);if(o){o.name=name;o.type=+$('#dty').value;o.periods=tmp}else S.depts.push({id:uid(),name,type:+$('#dty').value,periods:tmp});
 });pRows();
}
function delDept(id){
 if(S.emps.some(e=>e.dept==id))return toast('انقل موظفي القسم قبل حذفه');
 modal('حذف القسم','<p>سيتم حذف القسم وجداوله. هل أنت متأكد؟</p>',()=>{S.depts=S.depts.filter(d=>d.id!=id);Object.keys(S.sched).forEach(k=>{if(k.startsWith(id+'|'))delete S.sched[k]})});
}

/* ---------- الموظفون ---------- */
function emps(){
 const ds=vd();if(!ds.some(d=>d.id==V.ef))V.ef=S.role.t=='head'?ds[0]?.id:V.ef;
 const list=S.emps.filter(e=>ds.some(d=>d.id==e.dept)&&(!V.ef||e.dept==V.ef));
 return `<div class="card"><div class="row"><h2 style="margin:0">الموظفون</h2><select onchange="V.ef=this.value;render()"><option value="">كل الأقسام</option>${ds.map(d=>`<option value="${d.id}" ${V.ef==d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><span class="sp"></span><button class="btn" onclick="editEmp()">+ إضافة موظف</button></div><div class="ov"><table><tr><th>الاسم</th><th>الرقم الوظيفي</th><th>المسمى</th><th>القسم</th><th>نوع الدوام</th><th>أيام الإجازة</th><th>الحالة</th><th></th></tr>${list.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.num)}</td><td>${esc(e.title)}</td><td>${esc(dn(e.dept))}</td><td>${e.type}</td><td>${e.off.map(x=>D[x]).join('، ')||'—'}</td><td><button class="btn s ${e.active?'':'r'}" onclick="togE('${e.id}')">${e.active?'فعّال':'موقوف'}</button></td><td><button class="btn g s" onclick="editEmp('${e.id}')">تعديل</button> <button class="btn r s" onclick="delEmp('${e.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="8" class="mu">لا يوجد موظفون. أضف أول موظف.</td></tr>'}</table></div></div>`;
}
function togE(id){const e=S.emps.find(x=>x.id==id);e.active=!e.active;render()}
function editEmp(id){
 const ds=vd(),e=S.emps.find(x=>x.id==id)||{name:'',num:'',title:'',dept:ds[0]?.id,type:'متغير',off:[5],active:true};
 modal(id?'تعديل الموظف':'موظف جديد',`<div class="fl"><label>الاسم<input id="en" value="${esc(e.name)}"></label><label>الرقم الوظيفي<input id="enu" value="${esc(e.num)}"></label><label>المسمى الوظيفي<input id="et" value="${esc(e.title)}"></label><label>القسم (غيّره لنقل الموظف)<select id="ed">${ds.map(d=>`<option value="${d.id}" ${e.dept==d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>نوع الدوام<select id="ety">${TYPES.map(t=>`<option ${e.type==t?'selected':''}>${t}</option>`).join('')}</select></label><div class="mu">أيام الإجازة الثابتة</div><div class="chk">${D.map((x,i)=>`<label><input type="checkbox" name="off" value="${i}" ${e.off.includes(i)?'checked':''}>${x}</label>`).join('')}</div><label class="chk"><span><input type="checkbox" id="ea" ${e.active?'checked':''}> موظف فعّال</span></label></div>`,()=>{
  const v={name:$('#en').value.trim(),num:$('#enu').value.trim(),title:$('#et').value.trim(),dept:$('#ed').value,type:$('#ety').value,off:[...document.querySelectorAll('[name=off]:checked')].map(x=>+x.value),active:$('#ea').checked};
  if(!v.name||!v.num)return fail('الاسم والرقم الوظيفي مطلوبان');
  if(S.emps.some(x=>x.num==v.num&&x.id!=id))return fail('الرقم الوظيفي مستخدم لموظف آخر');
  const o=S.emps.find(x=>x.id==id);if(o)Object.assign(o,v);else S.emps.push({id:uid(),...v});
 });
}
function delEmp(id){modal('حذف الموظف','<p>سيُحذف الموظف من القائمة. هل أنت متأكد؟</p>',()=>{S.emps=S.emps.filter(e=>e.id!=id);Object.values(S.sched).forEach(sc=>Object.values(sc).forEach(day=>Object.keys(day).forEach(j=>day[j]=day[j].filter(x=>x!=id))))})}

/* ---------- الجداول ---------- */
function schedV(){
 const ds=vd(),role=S.role.t,can=role!='user';
 if(!ds.length)return'<div class="card">لا توجد أقسام متاحة.</div>';
 if(!ds.some(d=>d.id==V.d))V.d=ds[0].id;
 const d=ds.find(x=>x.id==V.d),k=key(d,V.y,V.m),sc=S.sched[k],n=new Date(V.y,V.m+1,0).getDate();
 const de=S.emps.filter(e=>e.dept==d.id),f=role=='user'?S.role.r:V.e;
 let rows='',miss=0;
 for(let i=1;i<=n;i++){
  const dow=new Date(V.y,V.m,i).getDay();let cells='',any=!f;
  d.periods.forEach((p,j)=>{
   const ids=(sc&&sc[i]&&sc[i][j])||[],s=p.need-ids.length;if(sc&&s>0)miss+=s;
   if(f){const has=ids.includes(f);if(has)any=true;cells+=`<td>${has?'<span class="chip">✓ مناوبة</span>':'—'}</td>`;return}
   cells+=`<td class="${sc&&s>0?'bad':''}" ${can?`onclick="editCell(${i},${j})" style="cursor:pointer"`:''}>${ids.map(x=>`<span class="chip">${esc(nm(x))}</span>`).join('')}${sc&&s>0?`<small class="sh">ينقص ${s}</small>`:''}</td>`;
  });
  if(any)rows+=`<tr><td class="dy">${i} ${D[dow]}</td>${cells}</tr>`;
 }
 let st='';
 if(sc&&!f){
  const c={};de.forEach(e=>c[e.id]=[0,0,0]);
  Object.values(sc).forEach(day=>d.periods.forEach((p,j)=>(day[j]||[]).forEach(id=>{if(c[id]){c[id][0]++;c[id][1]+=hrs(p);if(isN(p))c[id][2]++}})));
  st=`<div class="card"><h2>ملخص الموظفين</h2><div class="ov"><table><tr><th>الموظف</th><th>المناوبات</th><th>الساعات</th><th>الليلية</th></tr>${de.map(e=>{const x=c[e.id],w=x[1]<S.set.minH||x[1]>S.set.maxH;return`<tr><td>${esc(e.name)}${e.active?'':' (موقوف)'}</td><td>${x[0]}</td><td class="${w?'bad':''}">${x[1]}${w?' ⚠':''}</td><td>${x[2]}</td></tr>`}).join('')}</table></div></div>`;
 }
 const sel=(id,opts,val,fn)=>`<select onchange="${fn}">${opts.map(([v,l])=>`<option value="${v}" ${v==val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 return `<div class="card"><div class="row np">
  ${role=='user'?'':sel('d',ds.map(x=>[x.id,x.name]),V.d,'V.d=this.value;render()')}
  ${sel('m',MN.map((x,i)=>[i,x]),V.m,'V.m=+this.value;render()')}
  <input type="number" value="${V.y}" style="width:90px" onchange="V.y=+this.value;render()" aria-label="السنة">
  ${can?sel('e',[['','كل الموظفين'],...de.map(e=>[e.id,e.name])],V.e,'V.e=this.value;render()'):''}
  <span class="sp"></span>
  ${can?`<button class="btn" onclick="doGen()">إنشاء الجدول تلقائياً</button><button class="btn r" onclick="doClr()">مسح</button>`:''}
  <button class="btn g" onclick="window.print()">طباعة / PDF</button><button class="btn g" onclick="cp()">نسخ إلى Excel</button></div>
  ${can?`<div class="row np"><label>الحد الأقصى للساعات شهرياً <input type="number" value="${S.set.maxH}" style="width:75px" onchange="S.set.maxH=+this.value;save()"></label><label>الحد الأدنى <input type="number" value="${S.set.minH}" style="width:75px" onchange="S.set.minH=+this.value;save()"></label><label>أقصى مناوبات أسبوعياً <input type="number" value="${S.set.maxWeek}" style="width:60px" onchange="S.set.maxWeek=+this.value;save()"></label></div>`:''}
  <h2>${esc(d.name)} – ${MN[V.m]} ${V.y}${f?' – '+esc(nm(f)):''}</h2>
  ${sc?(miss&&!f?`<p class="err">مناوبات ينقصها موظفون: ${miss}. عدّل الخلايا الحمراء يدوياً أو أضف موظفين.</p>`:''):'<p class="mu">لم يُنشأ جدول لهذا الشهر بعد. اضغط «إنشاء الجدول تلقائياً».</p>'}
  <div class="ov"><table><tr><th>اليوم</th>${d.periods.map(p=>`<th>${esc(p.name)}<br><small>${p.start}–${p.end} (${p.need})</small></th>`).join('')}</tr>${rows||'<tr><td colspan="9" class="mu">لا توجد مناوبات لك في هذا الشهر</td></tr>'}</table></div></div>${st}`;
}
function curD(){return S.depts.find(d=>d.id==V.d)}
function doGen(){const d=curD();S.sched[key(d,V.y,V.m)]=gen(d,V.y,V.m);render();toast('تم إنشاء الجدول')}
function doClr(){const d=curD();modal('مسح الجدول','<p>سيُمسح جدول هذا الشهر. هل أنت متأكد؟</p>',()=>{delete S.sched[key(d,V.y,V.m)]})}
function editCell(i,j){
 const d=curD(),k=key(d,V.y,V.m);if(!S.sched[k])S.sched[k]={};const sc=S.sched[k];if(!sc[i])sc[i]={};
 const cur=sc[i][j]||[],p=d.periods[j];
 modal(`${i} ${MN[V.m]} – ${p.name}`,`<p class="mu">المطلوب: ${p.need} موظف. اختر الموظفين:</p><div class="chk" style="flex-direction:column">${S.emps.filter(e=>e.dept==d.id&&(e.active||cur.includes(e.id))).map(e=>`<label><input type="checkbox" name="cs" value="${e.id}" ${cur.includes(e.id)?'checked':''}>${esc(e.name)}</label>`).join('')}</div>`,()=>{
  const ids=[...document.querySelectorAll('[name=cs]:checked')].map(x=>x.value);
  for(const id of ids)for(const jj of Object.keys(sc[i]))if(jj!=j&&sc[i][jj].includes(id))return fail(`تعارض: ${nm(id)} لديه مناوبة أخرى في نفس اليوم`);
  sc[i][j]=ids;
 });
}
function cp(){
 const d=curD(),sc=S.sched[key(d,V.y,V.m)]||{},n=new Date(V.y,V.m+1,0).getDate();
 let t=['اليوم',...d.periods.map(p=>p.name+' '+p.start+'-'+p.end)].join('\t')+'\n';
 for(let i=1;i<=n;i++)t+=[i+' '+D[new Date(V.y,V.m,i).getDay()],...d.periods.map((p,j)=>((sc[i]&&sc[i][j])||[]).map(nm).join('، '))].join('\t')+'\n';
 const ok=()=>toast('تم النسخ. الصقه في Excel'),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('تعذّر النسخ')}a.remove()};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}

/* ---------- الواجهة والصلاحيات ---------- */
function roleUI(){
 $('#role').innerHTML=[['admin','مدير النظام'],['head','مسؤول قسم'],['user','مستخدم عادي']].map(([v,l])=>`<option value="${v}" ${S.role.t==v?'selected':''}>${l}</option>`).join('');
 const t=S.role.t,list=t=='head'?S.depts.map(d=>[d.id,d.name]):t=='user'?S.emps.map(e=>[e.id,e.name]):[];
 if(t!='admin'&&!list.some(x=>x[0]==S.role.r))S.role.r=list[0]?.[0]||'';
 $('#ref').style.display=t=='admin'?'none':'';$('#lgf').disabled=t!='admin';$('#lgs').style.display=t=='admin'?'':'none';
 $('#ref').innerHTML=list.map(([v,l])=>`<option value="${v}" ${S.role.r==v?'selected':''}>${esc(l)}</option>`).join('');
}
$('#role').onchange=e=>{S.role={t:e.target.value,r:''};V.e='';roleUI();render()};
$('#ref').onchange=e=>{S.role.r=e.target.value;render()};
function render(){
 const t=S.role.t,tabs=t=='admin'?[['dash','لوحة التحكم'],['depts','الأقسام'],['emps','الموظفون'],['sched','الجداول']]:t=='head'?[['dash','لوحة التحكم'],['emps','الموظفون'],['sched','الجداول']]:[['sched','جدولي']];
 if(!tabs.some(x=>x[0]==V.tab))V.tab=tabs[0][0];
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="btn ${V.tab==k?'':'g'}" onclick="V.tab='${k}';render()">${l}</button>`).join('');
 $('#main').innerHTML={dash,depts,emps,sched:schedV}[V.tab]();
 save();
}
function logoUI(){document.documentElement.style.setProperty('--lh',(S.lh||64)+'px');$('#lgr').value=S.lh||64;$('#lgi').innerHTML=S.logo?`<img src="${S.logo}" alt="شعار المستشفى">`:'<svg viewBox="0 0 24 24" style="height:100%;aspect-ratio:1" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#fff"/></svg>'}
$('#lgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');save();logoUI();toast('تم تحديث الشعار')};im.src=r.result};r.readAsDataURL(f)};
$('#lgr').oninput=e=>{S.lh=+e.target.value;document.documentElement.style.setProperty('--lh',S.lh+'px');save()};
roleUI();logoUI();render();
</script>
</body>
